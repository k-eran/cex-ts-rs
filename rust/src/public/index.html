<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rust CEX</title><style>
body{margin:0;background:#0b0d12;color:#e7e9ee;font:16px system-ui}main{max-width:1050px;margin:auto;padding:35px 18px}h1{font-size:3rem}.card{background:#171b27;border:1px solid #30374d;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}input,button{padding:11px;border-radius:8px;border:1px solid #424b67;background:#10131c;color:white;margin:5px}button{cursor:pointer;background:#6375e8;border:0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #30374d;padding:8px}.good{color:#72d7a3}.bad{color:#ff9cae}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:2.2rem}}
</style></head><body><main><h1>Rust CEX</h1><section id="auth" class="card"><input id="u" placeholder="username"><input id="p" type="password" placeholder="password"><button onclick="auth('/signup')">Create account</button><button onclick="auth('/signin')">Sign in</button><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><b>USD: </b><span id="usd"></span> <b>SOL: </b><span id="sol"></span><br><input id="amount" type="number" placeholder="amount"><button onclick="fund('/onramp')">Add USD</button><button onclick="fund('/deposit/sol')">Deposit SOL</button></div><div class="grid"><div class="card"><h2>Place order</h2><select id="side"><option value="bid">Buy</option><option value="ask">Sell</option></select><input id="price" type="number" placeholder="price"><input id="qty" type="number" placeholder="quantity"><button onclick="place()">Place order</button></div><div class="card"><h2>Order book</h2><div id="book"></div></div></div><div class="card"><h2>Open orders</h2><div id="orders"></div></div></section></main><script>
let token=localStorage.token;const $=id=>document.getElementById(id);async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});let d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}async function auth(path){try{if(path=='/signup')await api(path,{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});let d=await api('/signin',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});token=d.token;localStorage.token=token;show()}catch(e){$('msg').textContent=e.message}}function show(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');load()}async function fund(path){try{await api(path,{method:'POST',body:JSON.stringify({qty:+$('amount').value})});load()}catch(e){$('msg').textContent=e.message}}async function place(){try{await api('/order',{method:'POST',body:JSON.stringify({asset:'sol',side:$('side').value,price:+$('price').value,qty:+$('qty').value})});load()}catch(e){$('msg').textContent=e.message}}async function load(){let b=await api('/balance'),s=b.stockBalances.sol||{available:0,locked:0};$('usd').textContent=b.usdBalance.available.toFixed(2);$('sol').textContent=s.available.toFixed(4);let ob=await api('/orderbook');$('book').innerHTML=[...ob.asks,...ob.bids].map(x=>`<div class="row">${x.price.toFixed(2)} <span>${x.qty.toFixed(4)}</span></div>`).join('');let os=await api('/orders');$('orders').innerHTML=os.map(o=>`<div class="row">${o.side} ${o.qty-o.filled_qty} SOL @ ${o.price}<button onclick="cancel(${o.order_id})">Cancel</button></div>`).join('')||'No open orders'}async function cancel(id){await api('/cancel',{method:'POST',body:JSON.stringify({order_id:id})});load()}if(token)show();
</script></body></html>
